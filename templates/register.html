{% extends "base.html" %}
{% block title %}Create Account — ShopEase{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper" style="max-width:540px;">
        <div style="text-align:center;margin-bottom:1.75rem;">
            <div style="width:56px;height:56px;border-radius:16px;background:var(--gradient-brand);color:#ffffff;display:inline-flex;align-items:center;justify-content:center;font-size:1.45rem;margin-bottom:0.85rem;box-shadow:var(--shadow-glow);">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 style="font-size:1.65rem;font-weight:800;">Create Your ShopEase Account</h1>
            <p style="font-size:0.9rem;color:var(--text-secondary);">
                Enjoy persistent shopping carts, faster checkout, and live order tracking.
            </p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name *</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    required
                    minlength="2"
                    class="form-control"
                    placeholder="Alex Mercer"
                    value="{{ form_data.get('full_name', '') }}"
                >
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="form-control"
                        placeholder="alex@example.com"
                        value="{{ form_data.get('email', '') }}"
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        class="form-control"
                        placeholder="+1 (555) 000-0000"
                        value="{{ form_data.get('phone', '') }}"
                    >
                </div>
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label class="form-label" for="password">Password (Min 6 chars) *</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="6"
                        class="form-control"
                        placeholder="••••••••"
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password *</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        required
                        minlength="6"
                        class="form-control"
                        placeholder="••••••••"
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:0.5rem;">
                <i class="fa-solid fa-sparkles"></i> Create Account
            </button>
        </form>

        <div style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-secondary);">
            Already have an account? <a href="{{ url_for('login') }}" style="color:var(--purple-700);font-weight:700;">Sign In Here</a>
        </div>
    </div>
</div>
{% endblock %}
