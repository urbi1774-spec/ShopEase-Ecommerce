<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="metal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4c1d95" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bg1)"/>
  <circle cx="480" cy="120" r="110" fill="#ddd6fe" opacity="0.5"/>
  <circle cx="120" cy="480" r="130" fill="#bfdbfe" opacity="0.5"/>
  <g filter="url(#shadow1)">
    <!-- Headband -->
    <path d="M 165 310 A 135 145 0 0 1 435 310" fill="none" stroke="url(#metal1)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 185 280 A 115 125 0 0 1 415 280" fill="none" stroke="url(#accent1)" stroke-width="10" stroke-linecap="round"/>
    <!-- Left Slider -->
    <rect x="153" y="295" width="24" height="55" rx="8" fill="#475569"/>
    <!-- Right Slider -->
    <rect x="423" y="295" width="24" height="55" rx="8" fill="#475569"/>
    <!-- Left Earcup -->
    <g transform="rotate(-8 175 385)">
      <rect x="130" y="320" width="76" height="135" rx="38" fill="url(#metal1)"/>
      <rect x="142" y="332" width="52" height="111" rx="26" fill="url(#accent1)"/>
      <rect x="182" y="328" width="28" height="119" rx="14" fill="#1e293b"/>
      <circle cx="164" cy="387" r="14" fill="#f8fafc" opacity="0.25"/>
    </g>
    <!-- Right Earcup -->
    <g transform="rotate(8 425 385)">
      <rect x="394" y="320" width="76" height="135" rx="38" fill="url(#metal1)"/>
      <rect x="406" y="332" width="52" height="111" rx="26" fill="url(#accent1)"/>
      <rect x="390" y="328" width="28" height="119" rx="14" fill="#1e293b"/>
      <circle cx="436" cy="387" r="14" fill="#f8fafc" opacity="0.25"/>
