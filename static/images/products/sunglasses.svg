<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="lens8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bg8)"/>
  <g filter="url(#shadow8)">
    <!-- Temples -->
    <path d="M 105 265 L 185 215" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <path d="M 495 265 L 415 215" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <!-- Frame -->
    <rect x="95" y="255" width="175" height="115" rx="34" fill="#0f172a"/>
    <rect x="330" y="255" width="175" height="115" rx="34" fill="#0f172a"/>
    <path d="M 265 280 Q 300 262 335 280" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <!-- Polarized Lenses -->
    <rect x="110" y="268" width="145" height="89" rx="24" fill="url(#lens8)"/>
    <rect x="345" y="268" width="145" height="89" rx="24" fill="url(#lens8)"/>
    <!-- Glare Reflection -->
    <path d="M 130 280 L 165 280 L 140 345 L 118 345 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M 365 280 L 400 280 L 375 345 L 353 345 Z" fill="#ffffff" opacity="0.25"/>
  </g>
  <text x="300" y="545" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle" letter-spacing="2">SOLSTICE POLARIZED</text>
</svg>