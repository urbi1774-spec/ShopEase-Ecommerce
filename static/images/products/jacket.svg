<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bg7)"/>
  <g filter="url(#shadow7)">
    <!-- Hood & Collar -->
    <path d="M 240 120 Q 300 95 360 120 L 375 180 L 225 180 Z" fill="#1e1b4b"/>
    <!-- Jacket Silhouette -->
    <path d="M 215 165 L 385 165 L 475 245 L 440 295 L 395 250 L 395 455 L 205 455 L 205 250 L 160 295 L 125 245 Z" fill="url(#jacketGrad)"/>
    <!-- Center Zipper -->
    <line x1="300" y1="165" x2="300" y2="455" stroke="#a78bfa" stroke-width="5"/>
    <!-- Chest Waterproof Pocket -->
    <line x1="325" y1="235" x2="365" y2="235" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Side Pockets -->
    <line x1="230" y1="340" x2="255" y2="395" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <line x1="370" y1="340" x2="345" y2="395" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="300" y="545" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle" letter-spacing="2">VERTEX TECH SHELL</text>
</svg>