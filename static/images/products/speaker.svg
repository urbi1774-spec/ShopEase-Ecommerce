<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="spkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="url(#bg10)"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="300" cy="300" r="225" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="12 12"/>
  <g filter="url(#shadow10)">
    <!-- Carry Loop -->
    <path d="M 270 140 Q 300 95 330 140" fill="none" stroke="#6d28d9" stroke-width="12" stroke-linecap="round"/>
    <!-- Speaker Cylinder -->
    <rect x="195" y="135" width="210" height="325" rx="68" fill="url(#spkBody)"/>
    <!-- Acoustic Mesh Lines -->
    <line x1="220" y1="205" x2="380" y2="205" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="235" x2="380" y2="235" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="265" x2="380" y2="265" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="335" x2="380" y2="335" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="365" x2="380" y2="365" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
    <!-- Control Strip -->
    <rect x="282" y="210" width="36" height="175" rx="18" fill="#0f172a"/>
    <circle cx="300" cy="245" r="9" fill="#a78bfa"/>
    <circle cx="300" cy="295" r="9" fill="#60a5fa"/>
    <circle cx="300" cy="345" r="9" fill="#ffffff"/>
  </g>
  <text x="300" y="545" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle" letter-spacing="2">PULSEMINI 360 SPEAKER</text>
</svg>